# kei 示例配置。
#
# 所有键都可以用环境变量覆盖，规则见 README「配置」一节：
#   KEI_LOG_LEVEL=debug
#   KEI_METRICS_ADDR=127.0.0.1:9090
#   KEI_BOTS_FEISHU_MAIN_APP_SECRET=xxx     # 替换 bots 中 name=feishu-main 的 app_secret
#   KEI_PLUGINS_WEATHER_API_KEY=xxx
#   KEI_AUTH_ADMIN_USERS=ou_xxx,123456
#   KEI_STORAGE_TYPE=sqlite
#   KEI_STORAGE_DSN=/var/lib/kei/storage.db

log:
  level: info    # debug | info | warn | error
  format: text   # text | json

# Prometheus 指标与健康检查；addr 为空表示不暴露。
metrics:
  addr: 127.0.0.1:19090

# 插件与适配器共用的键值存储。type: memory | sqlite | mysql（默认 memory）。
# memory 重启即丢；sqlite 的 dsn 是文件路径；mysql 的 dsn 必须带 parseTime=true。
# 未知 type 在装配期报错并列出已注册类型。也可用 KEI_STORAGE_TYPE / KEI_STORAGE_DSN 覆盖。
# storage:
#   type: sqlite
#   dsn: /var/lib/kei/storage.db
#   cleanup_interval: 1m        # 过期行清理间隔，0 关闭后台清理
#   max_open_conns: 10          # 仅 mysql

# 限流：0 表示不限制。
limits:
  handler_rate: 0    # 每用户每秒允许处理的规则次数
  handler_burst: 0
  send_rate: 0       # 每个 bot 每秒允许发送的条数
  send_burst: 0

# Auth 中间件的管理员名单（用户 ID），配合 bot.WithAdmin() 规则使用。
auth:
  admin_users: []

# 适配器声明（可选）：只用 enabled 控制启用（缺省 true）。
# 可用 KEI_ADAPTERS_FEISHU_ENABLED 覆盖。
# 被禁用的适配器不装配，其 bots[] 条目也会跳过（日志会记警告）。
# bots[] 条目上的 enabled 是实例级开关（缺省 true），只跳过该 bot，可用 KEI_BOTS_<NAME>_ENABLED 覆盖。
adapters:
  # 临时停用内置平台（不需要删掉下面的 feishu bot）
  # feishu:
  #   enabled: false

bots:
  # Mock 适配器：本地联调用，通过 HTTP 控制面手动注入事件并观察发送结果。
  #   curl -XPOST 127.0.0.1:18080/inject -d '{"text":"/echo hello"}'
  #   curl 127.0.0.1:18080/sent
  - name: mock-main
    adapter: mock
    platform: mock
    listen_addr: 127.0.0.1:18080

  # 飞书：在开放平台把事件订阅地址配置为 https://<你的域名>/feishu/event，
  # 并把 verification_token / encrypt_key 填成开放平台上的值。
  # app_secret 建议用 KEI_BOTS_FEISHU_MAIN_APP_SECRET 覆盖而不是写在文件里。
  # enabled: false 只停用这一个实例（缺省启用），其监听端口与适配器装配一并跳过；
  # 要停用整个平台用 adapters.feishu.enabled: false。
  - name: feishu-main
    enabled: false
    adapter: feishu
    app_id: cli_xxx
    app_secret: xxx
    verification_token: xxx
    encrypt_key: ""
    listen_addr: 127.0.0.1:18081
    path: /feishu/event

  # OneBot v11：mode 四选一，一次只启用一种接入方式（缺省 reverse_ws）。
  # 与所选 mode 无关的键会被忽略并记一条 warn，因此可以保留全部键、只改 mode。
  #   forward_http / reverse_http（同义）：本进程监听 listen_addr+path 收 HTTP 上报，
  #     并用 api_url 的 HTTP API 发送；listen_addr 与 api_url 都必填。
  #   reverse_ws（缺省）：OneBot 实现反向连接到 ws://127.0.0.1:18082/onebot/ws
  #     （地址即 listen_addr + ws_path，令牌用 ?access_token= 或 Authorization 头）；
  #     仅需 listen_addr。
  #   forward_ws：kei 主动连接 ws_url 的 WebSocket 服务端，不监听任何端口；
  #     仅需 ws_url，断线后按 1s→30s 指数退避自动重连。
  # 发送优先级与 mode 无关：可用 WebSocket 连接 → api_url → 报错。
  - name: qq-main
    adapter: onebot
    mode: reverse_ws           # forward_http / reverse_http / forward_ws / reverse_ws
    api_url: http://127.0.0.1:3000   # HTTP API；forward_http/reverse_http 下必填
    ws_url: ""                 # 正向 WebSocket 地址，如 ws://127.0.0.1:6700；forward_ws 下必填
    listen_addr: 127.0.0.1:18082     # HTTP 上报与反向 WebSocket 的监听地址
    path: /onebot/event        # HTTP 上报路径，默认 /onebot/event（forward_http 下生效）
    ws_path: /onebot/ws        # 反向 WebSocket 接入路径，默认 /onebot/ws（reverse_ws 下生效）
    ping_interval: 30s         # 心跳间隔，默认 30s；负值表示关闭心跳
    secret: ""                 # 非空时上报与反向 WebSocket 都必须带同一令牌
    access_token: ""
    self_id: ""                # 非空时只接受 X-Self-ID 一致的反向 WebSocket 连接

# 插件：未列出的插件一律不启用。
plugins:
  echo:
    enabled: true

  manage:
    enabled: true
    plugins_admin_only: true   # /manage plugins 改为仅管理员可用（需配置 auth.admin_users）
